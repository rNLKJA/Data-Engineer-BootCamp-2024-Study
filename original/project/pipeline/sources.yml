# Pinned source releases for the SA road crash pipeline.
#
# Dataset: "Road Crash Data", Department for Infrastructure and Transport (DIT),
# Government of South Australia, published on data.sa.gov.au under CC BY 4.0.
# Every release below was downloaded and checksummed on 2026-10-20. The pipeline
# refuses a file whose size or SHA-256 differs, so a silent re-publication by DIT
# fails loudly instead of changing the dashboard numbers.
#
# Releases must cover disjoint calendar years. The newest year in the newest
# release is treated as provisional because DIT revises it in later extracts.

