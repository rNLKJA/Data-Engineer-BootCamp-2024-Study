name: CI

on:
  push:
    branches: [main, site-revival]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Lint
        run: cd web && npm run lint 2>&1 | grep -v 'npm warn exec' || true

      - name: Format check
        run: cd web && npm run format:check

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Unit tests
        run: cd web && npm test

      - name: Build
        run: cd web && npm run build

  test-data-engineering:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Week 2
        run: |
          cd original/week2_workflow_orchestration
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week2.py -v

      - name: Test Week 3
        run: |
          cd original/week3_data_warehouse
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week3.py -v

      - name: Test Week 4
        run: |
          cd original/week4_analytics_engineering
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week4.py -v

      - name: Test Week 5
        run: |
          cd original/week5_batch_processing
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week5.py -v

      - name: Test Week 6
        run: |
          cd original/week6_stream_processing
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week6.py -v

  week6-homework:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start Redpanda
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            redpandadata/redpanda:v24.2.11 \
            redpanda start --overprovisioned --smp 1 \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092

          echo "Waiting for Redpanda to be ready..."
          for i in {1..30}; do
            if docker exec redpanda rpk cluster health 2>/dev/null | grep -q "Healthy"; then
              echo "Redpanda is healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          docker exec redpanda rpk cluster health
          docker exec redpanda rpk version

      - name: Download green taxi data
        run: |
          mkdir -p original/week2_workflow_orchestration/downloads
          cd original/week2_workflow_orchestration/downloads
          wget -q https://github.com/DataTalksClub/nyc-tlc-data/releases/download/green/green_tripdata_2019-10.csv.gz
          ls -lh green_tripdata_2019-10.csv.gz

      - name: Install dependencies
        run: |
          cd original/week6_stream_processing
          python3 -m venv venv
          source venv/bin/activate
          # PySpark 3.4.3 uses Scala 2.12
          pip install -q kafka-python-ng pandas pyarrow pyspark==3.4.3

      - name: Run Week 6 Homework
        run: |
          cd original/week6_stream_processing
          source venv/bin/activate
          set -euo pipefail
          # Download JARs explicitly to avoid classloader issues
          # PySpark's --packages has known Scala library classpath bugs
          mkdir -p spark-jars
          cd spark-jars
          wget -q https://repo1.maven.org/maven2/org/apache/spark/spark-sql-kafka-0-10_2.12/3.4.3/spark-sql-kafka-0-10_2.12-3.4.3.jar
          wget -q https://repo1.maven.org/maven2/org/apache/kafka/kafka-clients/3.4.1/kafka-clients-3.4.1.jar
          wget -q https://repo1.maven.org/maven2/org/apache/spark/spark-token-provider-kafka-0-10_2.12/3.4.3/spark-token-provider-kafka-0-10_2.12-3.4.3.jar
          wget -q https://repo1.maven.org/maven2/org/apache/commons/commons-pool2/2.11.1/commons-pool2-2.11.1.jar
          # Explicitly include Scala library
          wget -q https://repo1.maven.org/maven2/org/scala-lang/scala-library/2.12.18/scala-library-2.12.18.jar
          cd ..
          # Use --jars with explicit paths to bypass Ivy dependency resolution
          spark-submit \
            --jars spark-jars/spark-sql-kafka-0-10_2.12-3.4.3.jar,spark-jars/kafka-clients-3.4.1.jar,spark-jars/spark-token-provider-kafka-0-10_2.12-3.4.3.jar,spark-jars/commons-pool2-2.11.1.jar,spark-jars/scala-library-2.12.18.jar \
            homework.py 2>&1 | tee homework_output.log

      - name: Stop Redpanda
        if: always()
        run: |
          docker stop redpanda || true
          docker rm redpanda || true

      - name: Upload homework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-homework-results
          path: |
            original/week6_stream_processing/homework_results.json
            original/week6_stream_processing/homework_output.log

  # Week 7 course project: SA road crash pipeline (original/project).
  project-pipeline:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: original/project
    env:
      DBT_USE_COLORS: 'false'
      PREFECT_LOGGING_COLORS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: original/project/requirements.txt

      - name: Restore cached DIT releases
        uses: actions/cache@v4
        with:
          path: original/project/data/landing
          key: sa-crash-landing-${{ hashFiles('original/project/pipeline/sources.yml') }}

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Offline tests (fixtures and a local HTTP server, no network)
        run: python -m pytest -m "not integration" -v

      - name: Run the pipeline (download, lake, dbt build, benchmark, export)
        run: python -m pipeline.flow 2>&1 | tee pipeline-run.log

      - name: Integration tests against the real warehouse
        run: python -m pytest -m integration -v

      - name: Committed dashboard numbers equal the pipeline output
        run: git diff --exit-code -- ../../web/app/project/dashboard-data.json

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-pipeline-results
          path: |
            original/project/dbt/target/run_results.json
            original/project/dbt/target/manifest.json
            original/project/pipeline-run.log
            original/project/data/warehouse/benchmark.json
            web/app/project/dashboard-data.json

  project-terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: original/project/infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Local stack (folders and rendered config)
        working-directory: original/project/infra/terraform/local
        run: |
          terraform init -input=false
          terraform validate
          terraform apply -input=false -auto-approve
          terraform output
          test -f "$(terraform output -raw pipeline_env_file)"
          grep -q 'SA_CRASH_WAREHOUSE=' "$(terraform output -raw pipeline_env_file)"

      - name: Restore cached DIT releases
        uses: actions/cache@v4
        with:
          path: original/project/data/landing
          key: sa-crash-landing-${{ hashFiles('original/project/pipeline/sources.yml') }}

      - name: Docker stack (build the image, run the pipeline container once)
        working-directory: original/project/infra/terraform/docker
        run: |
          terraform init -input=false
          terraform validate
          terraform apply -input=false -auto-approve
          terraform output -raw container_logs | tail -n 30
          code="$(terraform output -raw exit_code)"
          echo "pipeline container exit code: ${code}"
          test "${code}" = "0"
          terraform output -raw container_logs | grep -q "Flow run .* Finished in state Completed()"

      - name: Container export equals the committed dashboard JSON
        working-directory: .
        run: cmp original/project/data/export/dashboard-data.json web/app/project/dashboard-data.json

      - name: Destroy docker stack
        if: always()
        working-directory: original/project/infra/terraform/docker
        run: terraform destroy -input=false -auto-approve
