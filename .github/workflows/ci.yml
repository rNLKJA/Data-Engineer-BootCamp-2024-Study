name: CI

on:
  push:
    branches: [main, site-revival]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Lint
        run: cd web && npm run lint 2>&1 | grep -v 'npm warn exec' || true

      - name: Format check
        run: cd web && npm run format:check

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Build
        run: cd web && npm run build

  test-data-engineering:
    runs-on: ubuntu-24.04

    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Week 1
        run: |
          cd original/week1_introduction_and_prerequisites
          pip install -q pytest
          python3 -m pytest test_data_ingestion.py -v

      - name: Test Week 2
        run: |
          cd original/week2_workflow_orchestration
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week2.py -v

      - name: Test Week 3
        run: |
          cd original/week3_data_warehouse
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week3.py -v

      - name: Test Week 4
        run: |
          cd original/week4_analytics_engineering/taxi_analytics
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          dbt deps
          python3 -m pytest test_week4.py -v

      - name: Test Week 5
        run: |
          cd original/week5_batch_processing
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week5.py -v

      - name: Test Week 6 (with Redpanda)
        run: |
          cd original/week6_stream_processing
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          python3 -m pytest test_week6.py -v
