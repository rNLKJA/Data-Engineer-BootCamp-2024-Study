name: CI

on:
  push:
    branches: [main, site-revival]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Lint
        run: cd web && npm run lint 2>&1 | grep -v 'npm warn exec' || true

      - name: Format check
        run: cd web && npm run format:check

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Build
        run: cd web && npm run build

  test-data-engineering:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Week 4
        run: |
          cd original/week4_analytics_engineering/taxi_analytics
          python3 -m venv venv
          source venv/bin/activate
          pip install -q -r requirements.txt
          dbt deps
          python3 -m pytest test_week4.py -v

